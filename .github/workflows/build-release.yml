name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0)'
        required: true
        default: 'v0.0.0-dev'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        configuration: [Release]
        platform: [Win32, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -A ${{ matrix.platform }}

      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }}

      - name: Package artifact
        shell: pwsh
        run: |
          $config = '${{ matrix.configuration }}'
          $platform = '${{ matrix.platform }}'
          $srcDir = "build\$platform\$config"
          $artifactDir = "artifact"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          # Copy the exe
          Copy-Item "$srcDir\WTLCommDebuger.exe" -Destination $artifactDir -Force
          # Copy the pdb if it exists (debug symbols)
          if (Test-Path "$srcDir\WTLCommDebuger.pdb") {
            Copy-Item "$srcDir\WTLCommDebuger.pdb" -Destination $artifactDir -Force
          }
          # Zip the artifact
          Compress-Archive -Path "$artifactDir\*" -DestinationPath "WTLCommDebuger-${{ matrix.configuration }}-${{ matrix.platform }}.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WTLCommDebuger-${{ matrix.configuration }}-${{ matrix.platform }}
          path: WTLCommDebuger-${{ matrix.configuration }}-${{ matrix.platform }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine tag name
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: WTLCommDebuger ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: artifacts/**/*.zip
